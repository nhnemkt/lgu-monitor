name: LGU+ 네이버 순위 모니터링

on:
  schedule:
    # KST = UTC+9  (평일 월~금만 실행)
    - cron: '0 0 * * 1-5'   # 09시 KST
    - cron: '0 1 * * 1-5'   # 10시 KST
    - cron: '0 2 * * 1-5'   # 11시 KST
    - cron: '0 3 * * 1-5'   # 12시 KST
    # 13시 제외
    - cron: '0 5 * * 1-5'   # 14시 KST
    - cron: '0 6 * * 1-5'   # 15시 KST
    - cron: '0 7 * * 1-5'   # 16시 KST
    - cron: '0 8 * * 1-5'   # 17시 KST
    - cron: '0 9 * * 1-5'   # 18시 KST
  workflow_dispatch:         # 수동 실행 버튼

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # index.html, rankings.json 커밋 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 순위 수집 실행
        run: python monitor.py
        env:
          TZ: Asia/Seoul

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json index.html
          git diff --staged --quiet || git commit -m "순위 업데이트: $(TZ=Asia/Seoul date '+%Y-%m-%d %H시 KST')"
          git push
