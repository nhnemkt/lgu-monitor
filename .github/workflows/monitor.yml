name: LGU+ 네이버 순위 모니터링

on:
  workflow_dispatch:         # 수동 실행만 (자동 스케줄 비활성화)

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # index.html, rankings.json 커밋 권한

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install requests beautifulsoup4

      - name: 순위 수집 실행
        run: python monitor.py
        env:
          TZ: Asia/Seoul

      - name: 결과 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json index.html
          git diff --staged --quiet || git commit -m "순위 업데이트: $(TZ=Asia/Seoul date '+%Y-%m-%d %H시 KST')"
          git push
